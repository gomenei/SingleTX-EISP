description: "Paper Table 1: IF FTD, no added noise, 18 transmitter(s), 18-incidence source data."
train:
  dataset: "if"
  target: "epsilon"
  input_mode: "coordinate"
  multi_input_mode: "concat"
  depth: 8
  width: 512
  encoding_levels: 80
  epsilon_channels: 2
  output_activation: "linear"
  output_scale: 1
  measurement_scale: 1
  batch_size: 32
  epochs: 200
  lr: 0.001
  lr_step: 0
  epsilon_weight: 100
  train_noise: 0
  test_noise: 0
  noise_mode: "legacy"
  seed: 42
  point_chunk: 50176
  save_every: 20
  channel: -1
  train_data: "../data/train/if_inc18"
  test_data: "../data/test/IF/FTD"
  output: "../runs/if18_noise00_N18"
test:
  checkpoint: "../runs/if18_noise00_N18/last.pt"
  test_data: "../data/test/IF/FTD"
  output: "../results/IF_FTD_noise00_N18"
