description: "Paper Table 1: IF FDE, no added noise, 1 transmitter(s), 8-incidence source data."
train:
  dataset: "if"
  target: "epsilon"
  input_mode: "coordinate"
  multi_input_mode: "concat"
  depth: 8
  width: 512
  encoding_levels: 10
  epsilon_channels: 1
  output_activation: "linear"
  output_scale: 1
  measurement_scale: 1
  batch_size: 32
  epochs: 200
  lr: 0.001
  lr_step: 0
  epsilon_weight: 100
  train_noise: 0.05
  test_noise: 0
  noise_mode: "legacy"
  seed: 42
  point_chunk: 50176
  save_every: 20
  channel: 0
  train_data: "../data/train/if_inc8"
  test_data: "../data/test/IF/FDE"
  output: "../runs/if8_noise00_N1"
test:
  checkpoint: "../runs/if8_noise00_N1/last.pt"
  test_data: "../data/test/IF/FDE"
  output: "../results/IF_FDE_noise00_N1"
