description: "Paper Table 1: mnist, 5% noise, 1 transmitter(s). Shared CYLINDER+MNIST training; train the shared run once."
train:
  dataset: "mnist"
  target: "epsilon"
  input_mode: "coordinate"
  multi_input_mode: "concat"
  depth: 8
  width: 512
  encoding_levels: 10
  epsilon_channels: 1
  output_activation: "linear"
  output_scale: 1
  measurement_scale: 1
  batch_size: 32
  epochs: 200
  lr: 0.001
  lr_step: 0
  epsilon_weight: 100
  train_noise: 0.05
  test_noise: 0.05
  noise_mode: "legacy"
  seed: 42
  point_chunk: 131072
  save_every: 20
  channel: 0
  train_data: "../data/train/cylinder_mnist_inc16"
  test_data: "../data/test/mnist/mnist_test_inc16"
  output: "../runs/2d_noise05_N1"
test:
  checkpoint: "../runs/2d_noise05_N1/last.pt"
  test_data: "../data/test/mnist/mnist_test_inc16"
  output: "../results/mnist_noise05_N1"
