description: "Paper Table 1: cylinder, 30% noise, 16 transmitter(s). Shared CYLINDER+MNIST training; train the shared run once."
train:
  dataset: "cylinder"
  target: "epsilon"
  input_mode: "coordinate"
  multi_input_mode: "concat"
  depth: 8
  width: 512
  encoding_levels: 10
  epsilon_channels: 2
  output_activation: "linear"
  output_scale: 1
  measurement_scale: 1
  batch_size: 32
  epochs: 300
  lr: 0.001
  lr_step: 0
  epsilon_weight: 100
  train_noise: 0.3
  test_noise: 0.3
  noise_mode: "legacy"
  seed: 42
  point_chunk: 131072
  save_every: 20
  channel: -1
  train_data: "../data/train/cylinder_mnist_inc16"
  test_data: "../data/test/cylinder/cylinder_test_inc16"
  output: "../runs/2d_noise30_N16"
test:
  checkpoint: "../runs/2d_noise30_N16/last.pt"
  test_data: "../data/test/cylinder/cylinder_test_inc16"
  output: "../results/cylinder_noise30_N16"
